<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="tsuzuki-csrf" content="{{CSRF}}">
<meta name="tsuzuki-resume-default" content="{{RESUME_DEFAULT}}">
<meta name="tsuzuki-headless-in-list" content="{{HEADLESS_IN_LIST}}">
<meta name="tsuzuki-has-tasks" content="{{HAS_TASKS}}">
<title>Tsuzuki</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header id="top">
<span class="logo">Tsuzuki</span>
<nav class="views" aria-label="表示の切り替え">
<button data-view="tasks">タスク</button>
<button data-view="sessions">セッション</button>
<button data-view="docs">資料</button>
</nav>
<span class="qbox">
<input id="q" placeholder="セッションと資料を検索（/ で移動）" aria-label="検索" autocomplete="off" spellcheck="false">
<button id="q-clear" type="button" aria-label="検索語を消す" hidden>×</button>
</span>
<span class="narrow">
<select id="status-select" aria-label="状況"></select>
<select id="place-select" aria-label="場所"></select>
<select id="kind-select" aria-label="資料の種類"></select>
<span id="opts-slot"></span>
</span>
<span class="idx"><span id="status"></span><span id="counts"></span></span>
<button id="theme" type="button">表示：自動</button>
<button id="reindex">更新</button>
</header>
<div id="banner" role="alert" hidden></div>
<main id="panes">
<aside id="pane-left" aria-label="絞り込み">
<div id="left"></div>
<div id="list-opts">
<div class="ph">表示</div>
<label class="opt"><input type="checkbox" id="opt-headless"><span>ヘッドレスも並べる</span></label>
<label class="opt" id="opt-days-row"><span>期間</span><select id="opt-days">
<option value="7">7日</option>
<option value="30">30日</option>
<option value="90">90日</option>
<option value="all">全期間</option>
</select></label>
<label class="opt search-opt"><span>期間</span><select id="opt-qdays">
<option value="7">7日</option>
<option value="30">30日</option>
<option value="90">90日</option>
<option value="all">すべて</option>
</select></label>
<label class="opt search-opt"><span>発言者</span><select id="opt-role">
<option value="">すべて</option>
<option value="user">本人</option>
<option value="assistant">Claude</option>
</select></label>
<label class="opt search-opt"><span>並び順</span><select id="opt-order">
<option value="recent">新しい順</option>
<option value="count">一致の多い順</option>
</select></label>
</div>
</aside>
<section id="pane-list" aria-label="一覧"></section>
<section id="pane-detail" aria-label="詳細"></section>
</main>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="confirm" role="alertdialog" aria-modal="true" aria-label="確認" hidden></div>
</body>
</html>
