<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Mermaid の図</title>
<style>
html, body { margin: 0; padding: 0; background: transparent; }
#out svg { display: block; margin: 0 auto; }
</style>
</head>
<body>
<div id="out"></div>
<script>{{MERMAID}}</script>
<script>
"use strict";
// Tsuzuki の Mermaid の枠。サーバーが、1つ前の script に同梱のライブラリを入れて返す。
// この枠は隔離されていて（sandbox allow-scripts。起源は不透明）、CSP で外のものを読み込めない。
// 親の画面から {type: "tsuzuki-mermaid", code, theme} を受けて図を描き、{type: "tsuzuki-mermaid-result", ok: true,
// height}（描いた高さ。後で幅が変わって高さが変われば、また送る）か {type: "tsuzuki-mermaid-result", ok: false,
// error} を返す
(function () {
  var MAX_ERROR = 500; // 返す失敗の文の上限（字）
  var out = document.getElementById("out");
  var drawing = 0; // 新しい描画が始まったら、古い描画の結果は返さない
  var drawn = false;
  var lastHeight = -1;

  // 読み込んだときに勝手に描かない
  mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: "default" });

  function reply(message) {
    // 親の起源はこの枠から確かめられない（Referrer も送らない）。返すのは高さと失敗の文だけ
    window.parent.postMessage(message, "*");
  }

  function sendHeight() {
    var height = Math.ceil(out.getBoundingClientRect().height);
    if (height === lastHeight) return;
    lastHeight = height;
    reply({ type: "tsuzuki-mermaid-result", ok: true, height: height });
  }

  function errorText(error) {
    try {
      var text = error && typeof error.message === "string" ? error.message : String(error);
      return text.slice(0, MAX_ERROR);
    } catch (e) {
      return "";
    }
  }

  // 終わった描画の作業用の要素（mermaid が body に足す #d<ID>。描けなかったときは壊れた図の絵が入ったまま残る）
  // を消す。消すのはその描画の ID の要素だけ。mermaid は描画を順に行い、次の描画の要素を、前の描画の結果が
  // ここに届く前に body に足すので、ほかの要素に触れると次の描画が描けなくなる
  function removeOwn(id) {
    var node = document.getElementById("d" + id);
    if (node) node.remove();
  }

  function draw(code, theme) {
    var count = ++drawing;
    var id = "tsuzuki-mermaid-" + count;
    // 親の画面と同じ color-scheme にする（違うと、ブラウザが枠に不透明な地の色を付ける）
    document.documentElement.style.colorScheme = theme === "dark" ? "dark" : "light";
    Promise.resolve().then(function () {
      mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: theme === "dark" ? "dark" : "default" });
      return mermaid.render(id, code);
    }).then(function (result) {
      removeOwn(id);
      if (count !== drawing) return;
      out.innerHTML = result.svg; // mermaid が strict で DOMPurify を通した SVG。この枠の中だけに入れる
      drawn = true;
      lastHeight = -1;
      sendHeight();
    }, function (error) {
      removeOwn(id);
      if (count !== drawing) return;
      out.textContent = "";
      drawn = false;
      lastHeight = -1;
      reply({ type: "tsuzuki-mermaid-result", ok: false, error: errorText(error) });
    });
  }

  window.addEventListener("message", function (event) {
    if (event.source !== window.parent) return; // 親の画面からの頼みだけ
    var data = event.data;
    if (!data || typeof data !== "object" || data.type !== "tsuzuki-mermaid" || typeof data.code !== "string") return;
    draw(data.code, data.theme);
  });

  // 図の中のリンクは開かない（枠の中が外のページに移らないように）
  document.addEventListener("click", function (event) {
    var target = event.target;
    if (target && target.closest && target.closest("a")) event.preventDefault();
  }, true);

  // 枠の幅が変わって図の高さが変われば、高さを送り直す
  if (window.ResizeObserver) {
    new ResizeObserver(function () {
      if (drawn) sendHeight();
    }).observe(out);
  }
})();
</script>
</body>
</html>
